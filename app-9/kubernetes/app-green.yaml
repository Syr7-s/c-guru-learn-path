apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-green
  labels:
    app: myapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp
      version: green
  template:
    metadata:
      labels:
        app: myapp
        version: green
    spec:
      containers:
        - name: myapp
          image: europe-west1-docker.pkg.dev/playground-s-11-194074fb/syr-reg/myapp:green-v1
          ports:
            - containerPort: 80
              

